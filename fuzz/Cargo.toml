# Fuzz targets of the network decoders (ibx#488), run by hand, not in CI.
#
# Each target takes one group of decoders of `ibx::test_support::decoders`
# (the groups the property tests of src/robustness/ use); `engine` gives
# the input to the three message handlers of a hot loop.
#
#   cargo install cargo-fuzz                      # once; needs a nightly toolchain
#   python fuzz/seed_corpus.py                    # corpus from tests/fixtures/gw1040
#   cargo +nightly fuzz run ticks -- -max_total_time=60
#   cargo +nightly fuzz list
#
# On Windows (MSVC) the address sanitizer is needed (`-s none` does not
# link there): put its runtime on PATH and let it go on past the hooks it
# cannot set, for example in Git Bash:
#
#   export PATH="/c/Program Files (x86)/Microsoft Visual Studio/2022/BuildTools/VC/Tools/MSVC/<version>/bin/Hostx64/x64:$PATH"
#   export ASAN_WIN_CONTINUE_ON_INTERCEPTION_FAILURE=1
#
# The targets link the library of ibx-rlib/ (the same sources as an rlib):
# the crate's cdylib does not link with the fuzzer instrumentation.

[package]
name = "ibx-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ibx = { package = "ibx-rlib", path = "ibx-rlib", features = ["test-support"] }

# Not a member of the crate's build.
[workspace]
members = [".", "ibx-rlib"]

[profile.release]
debug = 1

[[bin]]
name = "ns"
path = "fuzz_targets/ns.rs"
test = false
doc = false
bench = false

