# The crate's library built as an rlib only, for the fuzz targets: the
# crate's own cdylib does not link with the fuzzer's instrumentation on
# Windows (unresolved `main` and `__sanitizer_cov_*`). Same sources; keep
# the dependencies as in the crate's Cargo.toml.

[package]
name = "ibx-rlib"
version = "0.8.0"
edition = "2024"
publish = false

[lib]
name = "ibx"
path = "../../src/lib.rs"
crate-type = ["rlib"]

[features]
test-support = ["dep:serde_json"]

[dependencies]
# Hot loop
quanta = "0.12"
core_affinity = "0.8"

# Crypto (RustCrypto ecosystem)
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
digest = "0.10"
aes = "0.8"
cbc = "0.1"

# Protocol
flate2 = "1"
base64 = "0.22"
hex = "0.4"

# Auth (big integer math for DH/SRP)
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
rand = "0.9"

# TLS
native-tls = "0.2"

# Secure-memory wrappers (zeroize plaintext credentials on drop)
zeroize = "1"

# Control plane
tokio = { version = "1", features = ["full"] }
crossbeam-channel = "0.5"

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
env_logger = "0.11"
mac_address = "1"


# Dates and time zones
jiff = "0.2.28"

# Scenario files of the replay tests (test-support only)
serde_json = { version = "1", optional = true }

# The crate's python feature is not built here.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("python"))'] }
