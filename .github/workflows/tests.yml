name: Tests

# Offline tests, started by hand (Actions tab or `gh workflow run Tests`):
# no secret, no network to the servers. The tests that log in are #[ignore]
# (Rust) or skipped without credentials (Python), so they show as ignored /
# skipped, never as passed.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The test build of the largest modules needs a large compiler stack.
  RUST_MIN_STACK: 134217728
  # No credentials: the live tests must not run.
  IB_USERNAME: ""
  IB_PASSWORD: ""

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build every target
        run: cargo test --all-targets --locked --no-run

      - name: Run the tests (live tests listed as ignored)
        run: cargo test --all-targets --locked --no-fail-fast

  python:
    name: maturin build and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Python module
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --quiet maturin pytest
          # The official client library: the comparison report takes its
          # argument names and unset values. Same release as the recordings.
          pip install --quiet "ibapi @ git+https://github.com/deepentropy/ibapi.git@v10.47.01"
          # With the test helpers, so the scenario replays run (ibx#515).
          maturin develop --locked --features python,test-support

      - name: Run the Python tests (live tests skipped)
        run: |
          . .venv/bin/activate
          python -m pytest tests/python -q -rs -p no:cacheprovider

  cpp:
    name: C++ library build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build/cpp/cargo"

      - name: The generated sources are the ones the tables give
        run: python3 cpp/gen/generate.py --check

      - name: Build the library, the examples and the tests
        run: |
          cmake -S cpp -B build/cpp -DCMAKE_BUILD_TYPE=Debug -DIBX_BUILD_TESTS=ON
          cmake --build build/cpp -j 4

      # Offline: every field and callback parameter, and the recorded
      # scenarios replayed through the C++ client. The live session
      # (live_paper) needs a login and is not run here.
      - name: Run the tests
        run: ctest --test-dir build/cpp --output-on-failure
