name: tests

# What has to hold before a change lands. Every job here passes on the tree as
# it stands, so a red result is the change and not a gate that was already red
# when it was written.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rust:
    name: cargo test --lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `config::expiry_tests` resolves zones by their legacy aliases
      # (`US/Eastern`). On 24.04 — which `ubuntu-latest` resolves to — those
      # aliases are not in `tzdata` at all: they moved to `tzdata-legacy`, so a
      # full `tzdata` install still leaves `/usr/share/zoneinfo/US/` absent and
      # both tests failing.
      - name: Install tzdata
        run: sudo apt-get update && sudo apt-get install -y tzdata tzdata-legacy

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --lib --all-targets --features dev-tools

      - name: Test
        run: cargo test --lib

      # The suites outside the library were run by nobody. A break confined to
      # test code compiles nowhere else, so it reached main unseen — and one
      # of these had been asserting against a guard that replaced it.
      # The live suites need a session and stay out.
      # Without the override each call with no engine to answer waits out the
      # full registration timeout, which is eight minutes across this suite.
      - name: Test the suites that need no session
        env:
          IBX_REGISTRATION_TIMEOUT_MS: "20"
        run: >
          cargo test
          --test control_plane
          --test depth_wire_test
          --test error_edge_concurrency
          --test hot_loop_lifecycle
          --test malformed_input
          --test protocol_vectors
          --test scenarios

      # The bindings are behind a non-default feature, so nothing above builds
      # them. The live phases they wrap need a session and are not run here;
      # everything else is, because a binding that stopped agreeing with the
      # engine is the failure this catches, and it costs one step to catch it.
      - name: Test the Python bindings
        run: |
          cargo test --lib --features python
          # And again with the injection methods compiled in, or the tests
          # that drive the client through them run nowhere.
          cargo test --lib --features python,test-helpers

  python:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5

      # The Rust job proves the bindings still agree with the engine. This
      # proves the surface a Python caller actually touches, which nothing ran
      # before: the suite had drifted to 23 failures without anyone seeing it.
      #
      # maturin has to build into the project environment. Left to pick its own
      # interpreter it resolves one from uv's build cache and installs there,
      # reporting success while the environment under test keeps the module it
      # already had.
      - name: Build the extension into the environment under test
        run: |
          uv venv
          # ib_async too: twelve tests establish that its own library runs on
          # this engine, and without it they are not collected and the
          # claim is tested nowhere.
          # And the reference clients the comparison page is measured against.
          # It is read from the clients it names: one that is not installed is
          # left out of the page rather than filled in from memory, so a
          # regeneration here without them produces a page that can never match
          # the committed one. Pinned to the versions that page states — a
          # release of either is a reason to regenerate it, not a reason for
          # this to go red on its own.
          uv pip install maturin pytest "ib_async==2.1.0" "ibapi==9.81.1.post1"
          # The suites reach for the injection methods by name, so the build
          # under test asks for them. A wheel does not: see the feature.
          # Every feature, not just the added one: this replaces what
          # pyproject configures rather than adding to it, and without
          # `python` maturin finds no pyo3 bindings, decides the crate is
          # cffi and fails on a missing module — after reporting the build
          # it did not do.
          .venv/bin/maturin develop --features python,extension-module,test-helpers

      # A recipe is read and trusted. One naming a method the library no longer
      # has costs a reader more than a missing page: they assume their own
      # setup is wrong. Needs the extension built above.
      - name: Every snippet on the site names something that exists
        run: .venv/bin/python scripts/check_recipe_snippets.py

      - name: Test
        run: .venv/bin/pytest tests/python -q

      # Here rather than beside the other document checks, because counting the
      # Python suite needs the extension built, and this is the job that builds
      # it. Run where it cannot count, it reports zero and calls every figure
      # wrong.
      #
      # A count in a shipped document is a claim, and one typed in once goes
      # quietly wrong as the suites grow. Every figure in the test inventory
      # had drifted, one of them by a factor of four.
      - name: The published test counts are what is there
        run: python scripts/check_status_counts.py

      # Here rather than beside the other document checks, because this is the
      # one job that has built the extension. The page is read from this client
      # as well as from the two it is compared against, and a job that cannot
      # import any of the three regenerates a page with their columns missing
      # and reports the committed one as stale.
      - name: Regenerate and compare
        run: |
          .venv/bin/python scripts/gen_api_docs.py
          .venv/bin/python scripts/gen_parity_matrix.py
          .venv/bin/python scripts/gen_wire_coverage.py
          # Fails on its own if a request returns as though it acted and did
          # not, so that kind of call cannot be added without someone deciding
          # to add it.
          .venv/bin/python scripts/gen_wire_reach.py
          # And what of an order reaches it. A call can reach the venue while
          # most of what a caller put in it does not.
          .venv/bin/python scripts/gen_order_field_reach.py
          # And what of a call's own arguments reaches anything. Three were
          # found by hand before this: one chose between a date and a number
          # and was dropped on both surfaces.
          .venv/bin/python scripts/gen_arg_reach.py
          # Staged, so a page a generator has only just started producing
          # counts as a difference rather than as an untracked file nobody sees.
          # The readme too: a generator writes the capability comparison into
          # it, and a check that looked only at docs/ would let the page a
          # reader lands on drift while the one behind it stayed true.
          git add -A docs/ README.md
          git diff --cached --exit-code docs/ README.md || {
            echo "::error::a generated file is stale — run the scripts under scripts/ and commit the result"
            exit 1
          }


  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Binaries, examples and tests were linted by nobody. A break in test
      # code compiles nowhere else and so reaches main unseen. This covers the
      # library too, so it is the only pass needed.
      # `dev-tools` names the measurement and capture binaries, which are off
      # by default so that installing the crate does not hand a caller
      # twenty-five of them. Lint them anyway: a tool nobody compiles is a
      # tool nobody can run when it is needed.
      - name: Lint everything that builds
        run: cargo clippy --lib --all-targets --features dev-tools -- -D warnings

      # A feature that is not the default is compiled by nobody until it breaks
      # somebody. Both configurations are lint-clean and stay that way.
      - name: Lint the Python bindings
        run: cargo clippy --lib --all-targets --features python -- -D warnings

      # The asynchronous surface is off by default, so nothing above builds it.
      # Left out, a break in it reaches main compiling nowhere.
      - name: clippy, asynchronous surface
        run: cargo clippy --lib --all-targets --features async -- -D warnings

      - name: Test, asynchronous surface
        run: cargo test --lib --features async

      # `cargo doc` renders an example without compiling it, so a broken one is
      # published looking right. This compiles and runs them.
      - name: The examples in the documentation
        run: cargo test --doc --features async

  docs:
    name: generated docs match the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The orphaned-doc check compares against the commit this push built
          # on, which a shallow checkout does not have.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A doc comment is attached by position, so a function inserted under an
      # existing block takes it and leaves the item it was written for bare.
      # `missing_docs` cannot see that: the count does not change, only which
      # item each doc is on. Five of these reached main before it was checked.
      # A cycle between two modules means neither can be read or changed
      # without the other. One was reintroduced by a compatibility shim for a
      # method returning a type no caller can use, and nothing noticed.
      - name: No module depends on one that depends on it
        run: python scripts/check_module_graph.py

      # A page includes a file and tells the reader to run an example; both can
      # move, and the book builds either way, publishing an empty block and an
      # instruction that fails. And an example a reader copies must not name a
      # door: the venue names the server this account is on, so a hostname in
      # a recipe is at best noise and at worst a door that has moved. Thirty
      # nine examples carried one, and the pages include them verbatim.
      - name: The book promises what is here, and names no door
        run: python scripts/check_docs_promises.py

      # A question pumps the queues into its own collector and the queues empty
      # as they are read, so the Tee is what also feeds the record a session
      # keeps. A callback it does not forward reaches the question and nobody
      # else — and compiles, because every trait method has an empty default.
      - name: Every callback reaches both sinks
        run: python scripts/check_wrapper_tee.py

      # The dispatcher hands a caller nothing at all for a figure the venue
      # left out. A wrapper method declaring that figure as a number refuses
      # the call, and the refusal leaves the reading loop and closes the
      # session — on every caller that did not write the method itself. The
      # suite cannot see it: a default nobody overrides is a default nobody
      # calls, and every test here writes its own.
      - name: A figure the venue left out reaches a wrapper that took the default
        run: python scripts/check_wrapper_defaults.py

      # These fabricate a connected session, fills and account values. A Rust
      # document attribute does not reach the interpreter and a leading
      # underscore hides nothing from `getattr`, so compiled in they are part
      # of what a caller who installed this can reach.
      - name: Nothing that fabricates a session is compiled into a wheel
        run: python scripts/check_injection_stays_out_of_the_wheel.py

      # Examples publish verbatim on the docs site, so a line naming another
      # project's tracker ships to readers who cannot open it.
      - name: Nothing points at another project's issue tracker
        run: python scripts/check_no_foreign_tracker_links.py

      # A published line that states what the venue holds internally, what an
      # account is charged, or what a second factor looks like is a claim this
      # client is not in a position to make: none of it crosses the wire it
      # reads. Sweeping them by hand missed a second copy of the same sentence
      # one file over, so the sweep is this instead.
      - name: Nothing published claims what this client cannot see
        run: python scripts/check_what_is_said.py

      - name: A function did not take a doc comment written for something else
        run: |
          python scripts/check_orphaned_docs.py --demo
          python scripts/check_orphaned_docs.py \
            "${{ github.event.pull_request.base.sha || github.event.before }}"

      # The API reference and the coverage matrix are generated from the source
      # and were regenerated by hand, so they drifted: a signature changed and
      # a call that had become real was still published as a stub.
  format:
    name: rustfmt (new files)
    runs-on: ubuntu-latest
    # New files only, and deliberately. The tree is hand-formatted and predates
    # any formatter; no rustfmt configuration comes within a few thousand lines
    # of reproducing it. Checking every file a change *touches* would therefore
    # demand reformatting whole legacy files to land a one-line fix, which is
    # the tree-wide rewrite arriving one pull request at a time. So the gate is
    # on what a change *adds*: a new file is formatted, and the rest is left
    # where it is.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check the Rust files this change adds
        run: |
          # A pull request is measured against its base; a push to main against
          # what main was before it. Measured only on pull requests, a file added
          # by a direct push was never formatted by anything.
          if [ -n "${{ github.base_ref }}" ]; then
            base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            base="${{ github.event.before }}"
          else
            base=$(git rev-parse HEAD~1)
          fi
          files=$(git diff --name-only --diff-filter=A "$base" HEAD -- '*.rs')
          if [ -z "$files" ]; then echo "no new Rust files"; exit 0; fi
          echo "$files"
          # shellcheck disable=SC2086
          rustfmt --edition 2024 --check $files

  portability:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    # Session storage sets owner-only permissions where the platform has them
    # and relies on the containing directory where it does not. That is two
    # code paths, and only one of them compiles on the machine this is usually
    # written on.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --lib

  rustdoc:
    name: rustdoc -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The API is documented by intra-doc links, and a link that stopped
      # resolving is a page that quietly lost what it pointed at. The crate
      # denies missing documentation, so an item that says nothing fails the
      # library build above rather than reaching this job.
      - name: Build the docs
        run: cargo doc --no-deps --lib
        env:
          RUSTDOCFLAGS: -D warnings

  advisories:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A client that carries an account's orders should not learn about a
      # vulnerable dependency from somebody else. This fails on an advisory
      # against something the crate builds, and not on a warning: the lock file
      # also names the dev-dependencies of dependencies, which are never
      # compiled here, and failing on those would train the job to be ignored.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check the advisory database
        run: cargo audit
