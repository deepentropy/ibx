name: Release

# Builds the Python wheel and publishes the release of a version tag.
#   - Called by the Prepare release workflow with its new tag, or on a pushed
#     version tag (git tag v0.9.1 && git push origin v0.9.1): builds the
#     wheel, then publishes the GitHub Release of the tag with notes from
#     scripts/release_notes.py and the wheel attached, marked latest.
#   - Manual run (Actions tab -> "Run workflow"): builds the wheel and keeps
#     it as a workflow artifact only. No release is created.
#
# Output: the wheel for Windows x64 and Python 3.13, as the releases so far.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: 'Version tag to release (v<Cargo.toml version>)'
        type: string
        required: true

env:
  # Tag to release: empty on a manual run (build only).
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - name: Check the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the Cargo.toml version $version (expected v$version)."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build the wheel
        run: |
          python -m pip install --quiet "maturin>=1.0,<2.0"
          maturin build --release --locked --interpreter python
          ls target/wheels

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}-${{ matrix.python }}
          path: target/wheels/*.whl
          retention-days: 7

  # The wheels are in: publish the release, marked latest. A re-run for the
  # same tag replaces the files of its release.
  publish:
    needs: build
    if: inputs.tag != '' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0         # tags, for the commits since the previous one
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py "$TAG" > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" wheels/*.whl --clobber
            gh release edit "$TAG" --draft=false --latest --notes-file notes.md
          else
            gh release create "$TAG" wheels/*.whl --verify-tag --latest --title "$TAG" --notes-file notes.md
          fi
