[package]
name = "ibx"
version = "0.7.1"
edition = "2024"

[lib]
name = "ibx"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "ibx"
path = "src/main.rs"

[features]
default = []
python = ["pyo3"]
# Split out so a test binary can link libpython. `extension-module` tells PyO3
# not to link it, which is right for the wheel and wrong for `cargo test`: the
# harness then fails at link time on every Python symbol, and no Rust-side test
# under this feature has ever run (ibx#381). The wheel build asks for both.
extension-module = ["pyo3/extension-module"]
compat = []

[dependencies]
# Hot loop
quanta = "0.12"
core_affinity = "0.8"

# Crypto (RustCrypto ecosystem)
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
digest = "0.10"
aes = "0.8"
cbc = "0.1"

# Protocol
flate2 = "1"
base64 = "0.22"
hex = "0.4"

# Auth (big integer math for DH/SRP)
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
rand = "0.9"

# TLS
native-tls = "0.2"

# Secure-memory wrappers (zeroize plaintext credentials on drop)
zeroize = "1"

# Control plane
tokio = { version = "1", features = ["full"] }
crossbeam-channel = "0.5"

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
env_logger = "0.11"
mac_address = "1"

# Python bindings (optional)
pyo3 = { version = "0.29", features = ["multiple-pymethods"], optional = true }
jiff = "0.2.28"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "fat"
