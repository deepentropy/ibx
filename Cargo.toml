[package]
name = "ibx"
version = "0.9.0"
edition = "2024"

[lib]
name = "ibx"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "ibx"
path = "src/main.rs"

# Farm message to API callback, through the in-memory links (ibx#446).
[[bin]]
name = "bench_md_dispatch"
path = "src/bin/bench_md_dispatch.rs"
required-features = ["test-support"]

[features]
default = []
python = ["pyo3"]
# The C entry layer the C++ library of `cpp/` sits on (ibx#235).
capi = []
# Test helpers (in-memory transport, scripted peer, normaliser, injection
# hooks). Never enabled by a release build; the test targets turn it on
# through the dev-dependency on this crate below.
test-support = ["dep:serde_json"]

[dependencies]
# Hot loop
quanta = "0.12"
core_affinity = "0.8"

# Crypto (RustCrypto ecosystem)
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
digest = "0.10"
aes = "0.8"
cbc = "0.1"
# Certificates of the key-exchange reply (ibx#276); `hazmat` gives the
# parse profile without the serial number limit.
x509-cert = { version = "0.3.0", default-features = false, features = ["hazmat"] }

# Protocol
flate2 = "1"
base64 = "0.22"
hex = "0.4"

# Auth (big integer math for DH/SRP)
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
rand = "0.9"

# TLS
native-tls = "0.2"

# Secure-memory wrappers (zeroize plaintext credentials on drop)
zeroize = "1"

# Control plane
tokio = { version = "1", features = ["full"] }
crossbeam-channel = "0.5"

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
env_logger = "0.11"
mac_address = "1"

# Python bindings (optional)
pyo3 = { version = "0.29", features = ["extension-module", "multiple-pymethods"], optional = true }
# With the zone database built in, for the systems whose own one lacks the
# older zone names (see `config::time_zone`).
jiff = { version = "0.2.28", features = ["tzdb-bundle-always"] }

# Scenario files of the replay tests (test-support only)
# Floats read exactly: the replays compare the recorded values to their
# last digit (ibx#515).
serde_json = { version = "1", optional = true, features = ["float_roundtrip"] }

# Reading the scanner parameters into their object model (ibx#571)
roxmltree = "0.21"

# The engine's wait on its sockets (ibx#530)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
# Property tests of the network decoders (ibx#488).
proptest = { version = "1", default-features = false, features = ["std"] }
# With the C entry layer, so the offline suite builds and tests it (ibx#235).
ibx = { path = ".", features = ["test-support", "capi"] }

[profile.release]
lto = "fat"
